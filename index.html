<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bakery</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>🍰 My Cake Catalog</h1>

  <div class="catalog">

      <img src="https://www.piesandtacos.com/wp-content/uploads/2024/04/chocolate-birthday-cake-scaled.jpg" alt="Chocolate Cake" />
      <h2>Chocolate Cake</h2>
      <p>Rich and creamy. ₹500</p>
    </div>

    <div class="cake-card">
      <img src="https://thescranline.com/wp-content/uploads/2025/02/VANILLA-CAKE-25-WEB-02.jpg" alt="Vanilla Cake" />
      <h2>Vanilla Cake</h2>
      <p>Soft and light. ₹400</p>
    </div>
    
    <div class="cake-card">
      <img src="https://www.rainbownourishments.com/wp-content/uploads/2025/02/small-batch-vegan-strawberry-cake-1.1.jpg" alt="Strawberry Cake" />
      <h2>Strawberry Cake</h2>

    </div>

  <script src="script.js"></script>

</html>
